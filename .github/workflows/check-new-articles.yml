name: Discover new Hatena articles
on:
  schedule:
    - cron: '17 0 * * *' # around 09:17 JST, delays possible
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source feeds
        run: python scripts/check_feeds.py
      - name: Commit unpublished candidates (if any)
        run: |
          if [ -f data/discovery_candidates.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/discovery_candidates.json
            if ! git diff --cached --quiet; then
              git commit -m 'docs: record new Hatena RNG candidates for review'
              git push
            fi
          fi
